
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LexVoice | Complaint Management</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Segoe UI", sans-serif;
    background: #071A1F;
    color: #E8F1F2;
    padding: 30px;
}

header {
    background: #102F35;
    border: 1px solid #24494F;
    padding: 22px;
    border-radius: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

h1, h2 {
    color: #D7B56D;
}

header p {
    color: #B7CBCD;
    margin-top: 6px;
}

button, select, textarea {
    font: inherit;
}

button {
    background: #D7B56D;
    color: #071A1F;
    border: none;
    padding: 10px 16px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: 600;
}

button:hover {
    opacity: 0.85;
}

#message {
    margin: 20px 0;
    color: #D7B56D;
}

#complaints {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 25px;
}

.complaint-card {
    background: #102F35;
    border: 1px solid #35585E;
    border-radius: 14px;
    padding: 22px;
}

.complaint-card h3 {
    color: #D7B56D;
    margin-bottom: 12px;
}

.complaint-card p {
    margin: 10px 0;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.meta {
    color: #B7CBCD;
    font-size: 14px;
}

.status {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 5px;
    background: #24494F;
    margin: 10px 0;
    font-size: 13px;
}

textarea, select {
    width: 100%;
    background: #071A1F;
    color: #E8F1F2;
    border: 1px solid #35585E;
    padding: 12px;
    border-radius: 7px;
    margin: 8px 0 14px;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

label {
    color: #D7B56D;
    display: block;
    margin-top: 12px;
}

.empty {
    color: #B7CBCD;
    padding: 25px;
    text-align: center;
}

@media(max-width:600px) {
    body {
        padding: 15px;
    }
}
</style>
</head>

<body>

<header>
    <div>
        <h1>Complaint Management</h1>
        <p>LexVoice Admin Panel</p>
    </div>
    <button onclick="loadComplaints()">Refresh Complaints</button>
</header>

<p id="message">Loading complaints...</p>

<div id="complaints"></div>

<script>
async function loadComplaints() {
    const container = document.getElementById("complaints");
    const message = document.getElementById("message");

    message.textContent = "Loading complaints...";
    container.replaceChildren();

    try {
        const response = await fetch("/api/admin/complaints");

        if (response.status === 401 || response.status === 403) {
            message.textContent = "Admin login required.";
            return;
        }

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Unable to load complaints.");
        }

        const complaints = data.complaints || [];

        if (complaints.length === 0) {
            message.textContent = "No complaints have been submitted yet.";
            return;
        }

        message.textContent = complaints.length + " complaint(s) found.";

        complaints.forEach(item => {
            const card = document.createElement("div");
            card.className = "complaint-card";

            const title = document.createElement("h3");
            title.textContent = item.subject || "Complaint";

            const user = document.createElement("p");
            user.className = "meta";
            user.textContent = "User: " + (item.name || "Unknown");

            const email = document.createElement("p");
            email.className = "meta";
            email.textContent = "Email: " + (item.email || "Not available");

            const description = document.createElement("p");
            description.textContent = item.description || "";

            const status = document.createElement("p");
            status.className = "status";
            status.textContent = "Status: " + (item.status || "Pending");

            const date = document.createElement("p");
            date.className = "meta";
            date.textContent = "Submitted: " + (item.created_at || "Not available");

            const solutionLabel = document.createElement("label");
            solutionLabel.textContent = "Admin Solution";

            const solution = document.createElement("textarea");
            solution.placeholder = "Write a solution for this complaint...";
            solution.value = item.solution || "";

            const statusLabel = document.createElement("label");
            statusLabel.textContent = "Update Status";

            const select = document.createElement("select");

            ["Pending", "In Progress", "Resolved"].forEach(value => {
                const option = document.createElement("option");
                option.value = value;
                option.textContent = value;
                select.appendChild(option);
            });

            select.value = ["Pending", "In Progress", "Resolved"].includes(item.status)
                ? item.status
                : "Pending";

            const save = document.createElement("button");
            save.textContent = "Save Solution & Status";
            save.addEventListener("click", () => {
                saveComplaint(item.id, solution.value, select.value, save);
            });

            card.append(
                title, user, email, description, status, date,
                solutionLabel, solution, statusLabel, select, save
            );

            container.appendChild(card);
        });

    } catch (error) {
        message.textContent = error.message;
    }
}

async function saveComplaint(id, solution, status, button) {
    button.disabled = true;
    button.textContent = "Saving...";

    try {
        const response = await fetch(
            "/api/admin/complaints/" + encodeURIComponent(id) + "/solution",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    solution: solution,
                    status: status
                })
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Unable to save complaint.");
        }

        alert("Complaint updated successfully!");
        await loadComplaints();

    } catch (error) {
        alert(error.message);
        button.disabled = false;
        button.textContent = "Save Solution & Status";
    }
}

loadComplaints();
</script>

</body>
</html>
