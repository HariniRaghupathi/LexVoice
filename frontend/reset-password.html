
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | LexVoice</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #071A1F;
            color: #E8F1F2;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: #102F35;
            padding: 38px;
            border: 1px solid #35585E;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            color: #D7B56D;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;
            color: #B7CBCD;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #35585E;
            border-radius: 9px;
            background: #071A1F;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #D7B56D;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #D7B56D;
            color: #071A1F;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #e7c985;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #D7B56D;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">LEXVOICE</div>

    <h2>Reset Password</h2>

    <p class="subtitle">
        Create a new password for your LexVoice account.
    </p>

    <form id="resetForm">

        <label for="password">New Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter new password"
            required
        >

        <label for="confirmPassword">Confirm Password</label>
        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            required
        >

        <button type="submit" id="resetButton">
            Reset Password
        </button>

    </form>

    <p id="message"></p>

    <a href="/login.html">Back to Login</a>

</div>

<script>
    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");

    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    if (!token) {
        message.style.color = "#ff8585";
        message.textContent =
            "Reset token is missing. Please request a new password reset link.";
        form.style.display = "none";
    }

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const password = document.getElementById("password").value;
        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
            message.style.color = "#ff8585";
            message.textContent = "Passwords do not match.";
            return;
        }

        if (password.length < 6 || !/[^A-Za-z0-9]/.test(password)) {
            message.style.color = "#ff8585";
            message.textContent =
                "Password must have at least 6 characters and one special character.";
            return;
        }

        const button = document.getElementById("resetButton");
        button.disabled = true;
        button.textContent = "Please wait...";

        try {
            const response = await fetch("/api/reset-password", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    token: token,
                    password: password
                })
            });

            const result = await response.json();

            message.style.color = result.success ? "#8be0a5" : "#ff8585";
            message.textContent = result.message;

            if (result.success) {
                form.style.display = "none";
            } else {
                button.disabled = false;
                button.textContent = "Reset Password";
            }

        } catch (error) {
            message.style.color = "#ff8585";
            message.textContent =
                "Unable to connect to the server. Please try again.";

            button.disabled = false;
            button.textContent = "Reset Password";
        }
    });
</script>

</body>
</html>
