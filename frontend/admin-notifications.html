<body>

<header>
    <div class="logo">⚖ LexVoice Admin</div>
    <a href="/admin.html" class="back">← Admin Dashboard</a>
</header>

<main class="container">

    <h1>🔔 Admin Notifications Center</h1>
    <p class="subtitle">
        Manage platform announcements and view your notifications.
    </p>

    <section class="panel">
        <h2>📢 Send Announcement</h2>

        <form id="announcementForm">
            <label for="title">Announcement Title</label>
            <input
                type="text"
                id="title"
                maxlength="150"
                placeholder="Enter announcement title"
                required
            >

            <label for="announcementMessage">Message</label>
            <textarea
                id="announcementMessage"
                maxlength="3000"
                placeholder="Write your announcement for all users..."
                required
            ></textarea>

            <button type="submit" class="primary" id="sendButton">
                Send to All Users
            </button>
        </form>

        <div id="formMessage" class="message"></div>
    </section>

    <section class="panel">
        <h2>📬 Admin Notifications</h2>

        <div class="section-actions">
            <button class="secondary" onclick="loadAdminNotifications()">
                ↻ Refresh
            </button>
        </div>

        <div id="notificationList">
            <div class="empty">Loading notifications...</div>
        </div>
    </section>

</main>

<script>
const form = document.getElementById("announcementForm");
const formMessage = document.getElementById("formMessage");
const sendButton = document.getElementById("sendButton");
const notificationList = document.getElementById("notificationList");

function showFormMessage(message, type) {
    formMessage.textContent = message;
    formMessage.className = "message " + type;
    formMessage.style.display = "block";
}

async function loadAdminNotifications() {
    notificationList.innerHTML =
        "<div class='empty'>Loading notifications...</div>";

    try {
        const response = await fetch("/api/admin/notifications");
        const data = await response.json();

        if (response.status === 401) {
            notificationList.innerHTML =
                "<div class='empty'>Admin login required. Please log in again.</div>";
            return;
        }

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Unable to load notifications.");
        }

        notificationList.innerHTML = "";

        if (!data.notifications || data.notifications.length === 0) {
            notificationList.innerHTML = `
                <div class="empty">
                    <h3>No admin notifications yet</h3>
                    <p>New admin notifications will appear here.</p>
                </div>
            `;
            return;
        }

        data.notifications.forEach(item => {
            const card = document.createElement("div");
            card.className = "notification";

            const heading = document.createElement("h3");
            heading.textContent = item.title;

            const message = document.createElement("p");
            message.textContent = item.message;

            const meta = document.createElement("div");
            meta.className = "meta";
            meta.textContent =
                (item.notification_type || "general") +
                " • " + (item.created_at || "");

            card.append(heading, message, meta);
            notificationList.appendChild(card);
        });

    } catch (error) {
        notificationList.innerHTML =
            "<div class='empty'>Unable to load notifications. Please refresh.</div>";
    }
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    formMessage.style.display = "none";

    const title = document.getElementById("title").value.trim();
    const message = document.getElementById("announcementMessage").value.trim();

    if (!title || !message) {
        showFormMessage("Please enter both title and message.", "error");
        return;
    }

    sendButton.disabled = true;
    sendButton.textContent = "Sending...";

    try {
        const response = await fetch(
            "/api/admin/notifications/announcement",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    title: title,
                    message: message
                })
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Announcement could not be sent.");
        }

        showFormMessage(
            data.message || "Announcement sent successfully to all users!",
            "success"
        );

        form.reset();

    } catch (error) {
        showFormMessage(error.message, "error");

    } finally {
        sendButton.disabled = false;
        sendButton.textContent = "Send to All Users";
    }
});

loadAdminNotifications();
</script>

</body>
</html>
