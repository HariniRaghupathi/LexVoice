
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | LexVoice</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #E8F1F2;
    background:
        radial-gradient(circle at top left, #294b45, transparent 45%),
        linear-gradient(135deg, #071A1F, #102F35);
}

.container {
    width: 100%;
    max-width: 430px;
    padding: 40px 35px;
    border: 1px solid #35585E;
    border-radius: 18px;
    background: rgba(7, 26, 31, 0.94);
    box-shadow: 0 15px 45px rgba(0,0,0,0.3);
}

.logo {
    color: #D7B56D;
    text-align: center;
    font-size: 27px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 30px;
}

.icon {
    text-align: center;
    font-size: 42px;
    margin-bottom: 15px;
}

h1 {
    text-align: center;
    font-size: 25px;
    margin-bottom: 12px;
}

.description {
    text-align: center;
    color: #B7CBCD;
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 28px;
}

label {
    display: block;
    margin-bottom: 9px;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 14px;
    background: #102F35;
    border: 1px solid #35585E;
    border-radius: 8px;
    color: #E8F1F2;
    font-size: 15px;
    outline: none;
    margin-bottom: 20px;
}

input:focus {
    border-color: #D7B56D;
}

button {
    width: 100%;
    padding: 14px;
    background: #D7B56D;
    color: #071A1F;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #ebd29a;
    transform: translateY(-2px);
}

.message {
    display: none;
    margin-top: 18px;
    padding: 12px;
    border-radius: 7px;
    font-size: 13px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

.back {
    display: block;
    text-align: center;
    color: #D7B56D;
    text-decoration: none;
    margin-top: 24px;
    font-size: 14px;
}

.back:hover {
    text-decoration: underline;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">⚖ LEXVOICE</div>

    <div class="icon">🔐</div>

    <h1>Forgot Password?</h1>

    <p class="description">
        Don't worry! Enter your registered email address.
        We'll help you reset your password.
    </p>

    <form id="forgotForm">

        <label for="email">Registered Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email address"
            required
        >

        <button type="submit" id="submitBtn">
            Generate Reset Link
        </button>

    </form>

    <div class="message" id="message"></div>

    <a href="login.html" class="back">
        ← Back to Login
    </a>

</div>

<script>
const form = document.getElementById("forgotForm");
const message = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();

    message.style.display = "none";
    submitBtn.disabled = true;
    submitBtn.textContent = "Please wait...";

    try {

        const response = await fetch("/api/forgot-password", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email: email })
        });

        const data = await response.json();

        message.style.display = "block";

        if (data.success) {

            message.style.background = "rgba(50,183,121,0.15)";
            message.style.color = "#8CE0B3";

            message.textContent = data.message;

            if (data.reset_url) {

                const resetLink = document.createElement("a");

                resetLink.href = data.reset_url;
                resetLink.textContent = "Open Password Reset Page";
                resetLink.style.display = "block";
                resetLink.style.marginTop = "12px";
                resetLink.style.color = "#D7B56D";

                message.appendChild(resetLink);
            }

        } else {

            message.style.background = "rgba(239,83,80,0.15)";
            message.style.color = "#ff9999";
            message.textContent = data.message || "Something went wrong.";

        }

    } catch (error) {

        message.style.display = "block";
        message.style.background = "rgba(239,83,80,0.15)";
        message.style.color = "#ff9999";
        message.textContent = "Unable to connect to the server. Please try again.";

    } finally {

        submitBtn.disabled = false;
        submitBtn.textContent = "Generate Reset Link";

    }

});
</script>

</body>
</html>
